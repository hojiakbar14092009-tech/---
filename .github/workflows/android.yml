name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/**", "index.html", "css/**", "js/**", "data/**", "models/**", "thumbs/**", "fonts/**", "vendor/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Ilova fayllarini tayyorlash
        working-directory: android-app
        run: |
          npm install
          node build-www.js
          npx cap add android
          npx cap sync android

      - name: Ikonka va splash (xato bo'lsa davom etadi)
        working-directory: android-app
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2F5D43' --splashBackgroundColor '#F5F1E6'

      - name: APK yig'ish
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: botanika-atlasi-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Releases bo'limiga joylash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Botanika-Atlasi.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Botanika-Atlasi.apk --title "Botanika Atlasi (Android)" --notes "Telefonga yuklab oling va o'rnating. Internetsiz ishlaydi."
