<!doctype html><meta charset="utf-8"><title>Model build</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script>
<script type="module">
import { SPECIES } from "./plants.js";
import { GLTFExporter } from "./GLTFExporter.js";
const ex = new GLTFExporter();
window.buildGLB = async (id) => {
  const obj = SPECIES[id]();
  let tris = 0; obj.traverse(o => { if (o.isMesh) tris += o.geometry.index.count / 3; });
  const buf = await ex.parseAsync(obj, { binary: true });
  let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return { b64: btoa(s), tris };
};
window.ready = true;
</script>
